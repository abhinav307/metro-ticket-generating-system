services:
  - type: web
    name: mtts-metro-fullstack
    env: node
    plan: free
    rootDir: standalone-demo
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: mtts_transit_db
      - key: CORS_ORIGIN
        value: "*"
      - key: APPROVER_USERNAME
        sync: false
      - key: APPROVER_PASSWORD
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: CANCELLATION_POLICY_STATUS
        value: UNCONFIGURED

services:
  - type: web
    name: mtts-metro-fullstack
    env: node
    plan: free
    rootDir: standalone-demo
    buildCommand: npm install && npm run build
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mtts-postgres
          property: connectionString
      - key: CORS_ORIGIN
        value: "*"

databases:
  - name: mtts-postgres
    databaseName: mtts_db
    user: mtts_user
    plan: free
